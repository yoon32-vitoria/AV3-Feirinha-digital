{% extends "base.html" %}

{% block conteudo %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-header bg-feira text-white">
                <h1 class="h4 mb-0">Cadastrar Novo Produto na Feira</h1>
            </div>
            <div class="card-body">
                {% if not vendedores %}
                    <div class="alert alert-warning">
                        Para cadastrar um produto, é necessário ter pelo menos um vendedor cadastrado.
                        <a href="{{ url_for('vendedores') }}" class="alert-link">Clique aqui para cadastrar um vendedor</a>.
                    </div>
                {% else %}
                    <form method="POST" action="{{ url_for('novo_produto') }}">
                        <div class="mb-3">
                            <label for="nome" class="form-label fw-bold">Nome do Produto *</label>
                            <input type="text" class="form-control" id="nome" name="nome" placeholder="Ex: Tomate Cereja Orgânico" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="categoria" class="form-label fw-bold">Categoria *</label>
                                <select class="form-select" id="categoria" name="categoria" required>
                                    {% for cat in categorias %}
                                        <option value="{{ cat }}">{{ cat }}</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="unidade" class="form-label fw-bold">Unidade de Venda *</label>
                                <select class="form-select" id="unidade" name="unidade" required>
                                    <option value="kg">Quilo (kg)</option>
                                    <option value="maço">Maço</option>
                                    <option value="dúzia">Dúzia</option>
                                    <option value="bandeja">Bandeja</option>
                                    <option value="unidade">Unidade</option>
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="preco" class="form-label fw-bold">Preço (R$) *</label>
                                <input type="number" step="0.01" min="0.10" class="form-control" id="preco" name="preco" placeholder="Ex: 5.50" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="vendedor_id" class="form-label fw-bold">Vendedor / Barraca *</label>
                                <select class="form-select" id="vendedor_id" name="vendedor_id" required>
                                    {% for v in vendedores %}
                                        <option value="{{ v.id }}">{{ v.nome }} ({{ v.barraca }})</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" id="disponivel" name="disponivel" checked>
                            <label class="form-check-label" for="disponivel">
                                Produto disponível em estoque para a próxima feira
                            </label>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-success">Salvar Produto</button>
                        </div>
                    </form>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
