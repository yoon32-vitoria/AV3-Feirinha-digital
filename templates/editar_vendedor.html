{% extends "base.html" %}

{% block conteudo %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h1 class="h4 mb-0">Editar Dados do Feirante</h1>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('editar_vendedor', id=vendedor.id) }}">
                    <div class="mb-3">
                        <label for="nome" class="form-label fw-bold">Nome do Vendedor(a) *</label>
                        <input type="text" class="form-control" id="nome" name="nome" value="{{ vendedor.nome }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="barraca" class="form-label fw-bold">Nome/Local da Barraca *</label>
                        <input type="text" class="form-control" id="barraca" name="barraca" value="{{ vendedor.barraca }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="telefone" class="form-label fw-bold">Telefone / WhatsApp *</label>
                        <input type="text" class="form-control" id="telefone" name="telefone" value="{{ vendedor.telefone }}" required>
                    </div>

                    <div class="mb-4">
                        <label for="dia_feira" class="form-label fw-bold">Dia de Funcionamento *</label>
                        <select class="form-select" id="dia_feira" name="dia_feira" required>
                            {% for dia in ['Quarta-feira', 'Sábado', 'Domingo', 'Sábado e Domingo'] %}
                                <option value="{{ dia }}" {% if dia == vendedor.dia_feira %}selected{% endif %}>
                                    {{ dia }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('vendedores') }}" class="btn btn-outline-secondary">Voltar</a>
                        <button type="submit" class="btn btn-primary">Salvar Alterações</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
