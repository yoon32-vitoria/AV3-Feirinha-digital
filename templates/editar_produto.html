{% extends "base.html" %}

{% block conteudo %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h1 class="h4 mb-0">Editar Produto</h1>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('editar_produto', id=produto.id) }}">
                    <div class="mb-3">
                        <label for="nome" class="form-label fw-bold">Nome do Produto *</label>
                        <input type="text" class="form-control" id="nome" name="nome" value="{{ produto.nome }}" required>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="categoria" class="form-label fw-bold">Categoria *</label>
                            <select class="form-select" id="categoria" name="categoria" required>
                                {% for cat in categorias %}
                                    <option value="{{ cat }}" {% if cat == produto.categoria %}selected{% endif %}>
                                        {{ cat }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="unidade" class="form-label fw-bold">Unidade de Venda *</label>
                            <select class="form-select" id="unidade" name="unidade" required>
                                {% for un in ['kg', 'maço', 'dúzia', 'bandeja', 'unidade'] %}
                                    <option value="{{ un }}" {% if un == produto.unidade %}selected{% endif %}>
                                        {{ un }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="preco" class="form-label fw-bold">Preço (R$) *</label>
                            <input type="number" step="0.01" min="0.10" class="form-control" id="preco" name="preco" value="{{ produto.preco }}" required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="vendedor_id" class="form-label fw-bold">Vendedor / Barraca *</label>
                            <select class="form-select" id="vendedor_id" name="vendedor_id" required>
                                {% for v in vendedores %}
                                    <option value="{{ v.id }}" {% if v.id == produto.vendedor_id %}selected{% endif %}>
                                        {{ v.nome }} ({{ v.barraca }})
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" id="disponivel" name="disponivel" {% if produto.disponivel %}checked{% endif %}>
                        <label class="form-check-label" for="disponivel">
                            Produto disponível em estoque para a próxima feira
                        </label>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">Voltar</a>
                        <button type="submit" class="btn btn-primary">Salvar Alterações</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
